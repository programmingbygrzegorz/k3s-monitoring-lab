# hello-lab – własny obraz z rejestru na maszynie monitoring (Etap 4, ćwiczenia z obrazu, poziom 7).
# Wymaga: rejestru 192.168.180.54:5000 z obrazem hello-lab:1.0 i pliku
# /etc/rancher/k3s/registries.yaml na węzłach (docs/etap-4-monitoring-zewnetrzny/02-wlasny-obraz.md).
# Wdrożenie (na k3s-master): kubectl apply -f ~/k3s-monitoring-lab/kubernetes/hello-lab/hello-lab.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: hello-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-lab
  namespace: hello-lab
  labels:
    app: hello-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-lab
  template:
    metadata:
      labels:
        app: hello-lab
    spec:
      containers:
        - name: hello-lab
          image: 192.168.180.54:5000/hello-lab:1.0
          ports:
            - containerPort: 8080
          env:
            - name: APP_COLOR
              value: "#2f855a"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hello-lab
  namespace: hello-lab
spec:
  type: NodePort
  selector:
    app: hello-lab
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30880
