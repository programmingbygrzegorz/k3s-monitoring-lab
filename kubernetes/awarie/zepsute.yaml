# Celowo zepsute obiekty do ćwiczeń z diagnozy (Etap 5, docs/etap-5-scenariusze-awarii/02-typowe-awarie-kubernetesa.md).
# Każdy obiekt psuje się w inny, typowy sposób – opis w komentarzu nad nim.
# Wdrożenie (na k3s-master): kubectl apply -f ~/k3s-monitoring-lab/kubernetes/awarie/zepsute.yaml
# Sprzątanie:                 kubectl delete namespace awarie
# Pody z obrazem hello-lab wymagają rejestru z Etapu 4 (docs/etap-4-monitoring-zewnetrzny/02-wlasny-obraz.md).
apiVersion: v1
kind: Namespace
metadata:
  name: awarie
---
# 1. ImagePullBackOff – tag 9.9 nie istnieje w rejestrze.
apiVersion: v1
kind: Pod
metadata:
  name: zly-obraz
  namespace: awarie
spec:
  containers:
    - name: app
      image: 192.168.180.54:5000/hello-lab:9.9
---
# 2. CrashLoopBackOff – aplikacja kończy się kodem 1 (brak pliku konfiguracyjnego).
apiVersion: v1
kind: Pod
metadata:
  name: crashloop
  namespace: awarie
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "echo 'Start aplikacji'; echo 'BLAD: brak pliku /config/app.conf' >&2; exit 1"]
---
# 3. OOMKilled – program chce 200 MiB, limit to 64 MiB.
apiVersion: v1
kind: Pod
metadata:
  name: oom
  namespace: awarie
spec:
  containers:
    - name: app
      image: 192.168.180.54:5000/hello-lab:1.0
      command: ["python", "-c", "b = bytearray(200 * 1024 * 1024); print('zajete 200 MiB')"]
      resources:
        limits:
          memory: 64Mi
---
# 4. Pending – żądanie 50 GiB pamięci, a węzły mają po ~5 GiB.
apiVersion: v1
kind: Pod
metadata:
  name: za-duzo-pamieci
  namespace: awarie
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      resources:
        requests:
          memory: 50Gi
---
# 5. Pending – żaden węzeł nie ma etykiety dysk=ssd.
apiVersion: v1
kind: Pod
metadata:
  name: zly-nodeselector
  namespace: awarie
spec:
  nodeSelector:
    dysk: ssd
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
---
# 6. CreateContainerConfigError – Secret baza-haslo nie istnieje.
apiVersion: v1
kind: Pod
metadata:
  name: brak-sekretu
  namespace: awarie
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: baza-haslo
              key: password
---
# 7. RunContainerError – w obrazie nie ma programu /bin/nie-ma-takiego.
apiVersion: v1
kind: Pod
metadata:
  name: zle-polecenie
  namespace: awarie
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["/bin/nie-ma-takiego"]
---
# 8. Running, ale 0/1 READY – sonda gotowości pyta o adres, którego aplikacja nie ma (404).
apiVersion: v1
kind: Pod
metadata:
  name: readiness
  namespace: awarie
spec:
  containers:
    - name: app
      image: 192.168.180.54:5000/hello-lab:1.0
      readinessProbe:
        httpGet:
          path: /gotowe
          port: 8080
        periodSeconds: 5
---
# 9. Restarty co kilkanaście sekund – sonda życia pyta zły port, kubelet zabija zdrowy kontener.
apiVersion: v1
kind: Pod
metadata:
  name: liveness
  namespace: awarie
spec:
  containers:
    - name: app
      image: 192.168.180.54:5000/hello-lab:1.0
      livenessProbe:
        httpGet:
          path: /healthz
          port: 9999
        periodSeconds: 5
        failureThreshold: 2
---
# 10. Service bez endpointów – selektor app: wep (literówka), a pod ma etykietę app: web.
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: awarie
  labels:
    app: web
spec:
  containers:
    - name: app
      image: 192.168.180.54:5000/hello-lab:1.0
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: awarie
spec:
  selector:
    app: wep
  ports:
    - port: 80
      targetPort: 8080
---
# 11. PVC w stanie Pending – klasa dysków szybki-dysk nie istnieje (w k3s jest local-path).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dane
  namespace: awarie
spec:
  storageClassName: szybki-dysk
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
