# Kontener próbuje zająć 250 MiB przy limicie 100 MiB -> OOMKilled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-oom
  namespace: chaos
spec:
  replicas: 1
  selector:
    matchLabels:
      scenario: oom
  template:
    metadata:
      labels:
        scenario: oom
    spec:
      containers:
        - name: memory-hog
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]
          resources:
            requests:
              memory: 50Mi
            limits:
              memory: 100Mi
