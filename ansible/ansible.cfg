[defaults]
inventory = inventory.ini
roles_path = roles
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
# Klucze hostów są sprawdzane w ~/.ssh/known_hosts. Nowa maszyna jest dopisywana przy pierwszym
# połączeniu (StrictHostKeyChecking=accept-new w ssh_args), a zmieniony klucz przerywa połączenie.
# Wyłączone sprawdzanie ukryło kiedyś klony ze wspólnym kluczem hosta (docs/08).
host_key_checking = True

[privilege_escalation]
# Ubuntu 25.10+ ma domyślnie sudo-rs, którego pytania o hasło Ansible nie rozpoznaje
# ("Timeout waiting for privilege escalation prompt"). sudo.ws to klasyczne sudo,
# nadal instalowane obok. Na starszym Ubuntu (bez sudo.ws) usuń tę linię.
become_exe = sudo.ws

[ssh_connection]
pipelining = True
# Domyślne opcje Ansible (-C, ControlMaster, ControlPersist) plus accept-new.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
