# Wspólne ustawienia laboratorium (odpowiednik lab.env dla Ansible).
# Ustawienia zależne od Twojej sieci – iface i admin_cidr – są w inventory.ini ([all:vars]):
# group_vars/all/main.yml ma wyższy priorytet niż inventory, więc tutaj by je nadpisywał.

timezone: Europe/Warsaw

# Kanał instalacji k3s: stable, latest lub konkretna wersja (np. v1.31)
k3s_channel: stable

# Domyślne sieci podów i usług k3s
k3s_pod_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16

# Firewall ufw na maszynach
enable_ufw: true

# Logowanie przez SSH tylko kluczem (Ansible i tak łączy się kluczem – docs/06, krok 2)
ssh_disable_password: true
